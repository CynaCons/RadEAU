# cargo-deny: security advisories, license allowlist, crate sources (PLAN v0.1.13 static checks).
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "Tauri GTK transitive dependency; no safe upgrade is available." },
  { id = "RUSTSEC-2025-0081", reason = "Tauri urlpattern transitive dependency; no safe upgrade is available." },
  { id = "RUSTSEC-2025-0075", reason = "Tauri urlpattern transitive dependency; no safe upgrade is available." },
  { id = "RUSTSEC-2025-0080", reason = "Tauri urlpattern transitive dependency; no safe upgrade is available." },
  { id = "RUSTSEC-2025-0100", reason = "Tauri urlpattern transitive dependency; no safe upgrade is available." },
  { id = "RUSTSEC-2025-0098", reason = "Tauri urlpattern transitive dependency; no safe upgrade is available." },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
