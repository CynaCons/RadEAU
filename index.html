<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RadEAU</title>
    <link rel="stylesheet" href="/src/theme/tokens.css" />
    <style>
      /* Base document chrome — colors via tokens only (VU-002). */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--surface-canvas);
        color: var(--text-primary);
        font-family: var(--font-ui);
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
        border-radius: 0;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scroll-thumb-hover);
      }

      /* Startup overlay (VU-025): painted by the document before any framework
         code runs, removed by the app after mount via a 220 ms fade. */
      #startup-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: var(--surface-canvas);
        opacity: 0.86;
        transition: opacity 220ms ease;
        pointer-events: auto;
      }
      #startup-overlay.fading {
        opacity: 0;
        pointer-events: none;
      }
      #startup-overlay .mark {
        width: 96px;
        height: 96px;
        animation: startup-pulse 1.2s ease-in-out infinite;
      }
      #startup-overlay .label {
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-primary);
      }
      @keyframes startup-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.92);
          opacity: 0.7;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #startup-overlay {
          transition: none;
        }
        #startup-overlay .mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-overlay">
      <svg class="mark" viewBox="0 0 96 96" aria-hidden="true">
        <circle cx="48" cy="48" r="42" fill="none" stroke="var(--accent-primary)" stroke-width="4" />
        <polyline
          points="16,48 34,48 42,26 54,70 62,48 80,48"
          fill="none"
          stroke="var(--info)"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <div class="label">RadEAU</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
