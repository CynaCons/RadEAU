[package]
name = "radeau"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "RadEAU — automotive Ethernet network analysis (SOME/IP, SOME/IP-SD, gPTP)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
radeau-proto = { path = "../crates/radeau-proto" }
radeau-catalog = { path = "../crates/radeau-catalog" }
radeau-pcap = { path = "../crates/radeau-pcap" }
radeau-livecap = { path = "../crates/radeau-livecap" }
tauri-plugin-dialog = "2"
open = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry"] }
